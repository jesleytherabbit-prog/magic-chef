<title>Magic Chef · Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Pinyon+Script&family=JetBrains+Mono:wght@500&display=swap">
<script>try{ const t=localStorage.getItem('mc-tema'); if(t==='light'||t==='dark') document.documentElement.dataset.theme=t; }catch(e){}</script>
<style>
/* Layout: cabecera con pestañas; cada vista es una mesa de trabajo de máster.
   Paleta del concurso: madera, marfil, terracota, salvia y oro. */
:root{
  --bg:#EADBC2; --wood:#E2CDA9; --card:#FBF7EF; --card2:#F3EAD8; --ink:#3E3127; --soft:#7A6857;
  --line:rgba(62,49,39,.16); --terra:#A9573A; --terra-ink:#8A452D; --sage:#5E7752; --gold:#B8924A; --gold-soft:#E3C98E;
  --walnut:#2E2118; --on-dark:#F3E6CF; --ok:#5E7752; --warn:#B9822F; --bad:#A9473A; --mute:#A89A88;
  --display:'Cinzel',Georgia,serif; --body:'Cormorant Garamond',Georgia,serif; --script:'Pinyon Script',cursive; --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1E1712; --wood:#2A2019; --card:#2E241C; --card2:#382C22; --ink:#EFE3CF; --soft:#B9A68D; --line:rgba(239,227,207,.14);
  --terra:#D98462; --terra-ink:#E9A182; --sage:#93AE84; --gold:#D4AF6A; --gold-soft:#8F7443; --walnut:#140E0A; --on-dark:#F3E6CF;
  --ok:#93AE84; --warn:#D9A552; --bad:#E07A68; --mute:#7C6E5E; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1E1712; --wood:#2A2019; --card:#2E241C; --card2:#382C22; --ink:#EFE3CF; --soft:#B9A68D; --line:rgba(239,227,207,.14);
  --terra:#D98462; --terra-ink:#E9A182; --sage:#93AE84; --gold:#D4AF6A; --gold-soft:#8F7443; --walnut:#140E0A; --on-dark:#F3E6CF;
  --ok:#93AE84; --warn:#D9A552; --bad:#E07A68; --mute:#7C6E5E; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;margin:0;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 22px)}
.wrap{max-width:1180px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.06em;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--display);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--sage)}
.num{font-variant-numeric:tabular-nums}

/* cabecera */
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;justify-content:space-between;padding:16px 18px;background:var(--walnut);color:var(--on-dark);border-radius:10px;border:1px solid var(--gold)}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:22px;color:var(--gold-soft)}
:root .brand h1{color:#E3C98E}
.brand .script{font-family:var(--script);font-size:28px;color:#E7A07F;line-height:1}
.turnbox{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#CDBBA2}
.turnbox button{width:30px;height:30px;border-radius:50%;border:1px solid #C4A05A;background:transparent;color:#E3C98E;cursor:pointer}
.turnbox b{font-size:22px;color:#F3E6CF;letter-spacing:0}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px}
nav.tabs button{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:99px;cursor:pointer;font-family:var(--display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
nav.tabs button[aria-selected="true"]{background:var(--terra);border-color:var(--terra);color:#FBF7EF}
nav.tabs button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sample{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;margin-bottom:16px;border:1px dashed var(--gold);border-radius:8px;background:var(--card2);font-size:15px}
.btn{border:1px solid var(--gold);background:var(--card);padding:6px 12px;border-radius:6px;cursor:pointer;font-family:var(--display);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.btn.primary{background:var(--terra);border-color:var(--terra);color:#FBF7EF}
.btn:hover{border-color:var(--terra)}

section.view{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.panel,.grid2>*{min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel h2{font-size:15px;color:var(--terra-ink)}
.panel .sub{color:var(--soft);font-style:italic;margin:4px 0 12px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}

/* pabellón */
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:14px;color:var(--soft);margin-bottom:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.hall{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;position:relative}
.hall .row-label{font-family:var(--display);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);text-align:center;border-bottom:1px solid var(--gold);padding-bottom:4px}
.stall{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 10px 6px 6px;border:1px solid var(--line);border-left:4px solid var(--mute);border-radius:8px;background:var(--card2);cursor:pointer;text-align:left;width:100%}
.stall img{width:44px;height:55px;object-fit:cover;border-radius:22px 22px 4px 4px;border:1px solid var(--gold)}
.stall .n{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.04em;line-height:1.2}
.stall .meta{font-size:13px;color:var(--soft)}
.stall .st{font-family:var(--display);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:99px;white-space:nowrap}
.s-pend{border-left-color:var(--mute)} .s-pend .st{background:var(--line);color:var(--soft)}
.s-rap{border-left-color:var(--ok)} .s-rap .st{background:var(--ok);color:#FBF7EF}
.s-nor{border-left-color:var(--gold)} .s-nor .st{background:var(--gold);color:#2E2118}
.s-len{border-left-color:var(--warn)} .s-len .st{background:var(--warn);color:#2E2118}
.s-aus{border-left-color:var(--bad)} .s-aus .st{background:var(--bad);color:#FBF7EF}
.jurybar{grid-column:1/-1;text-align:center;padding:8px;border:1px dashed var(--gold);border-radius:8px;font-family:var(--script);font-size:24px;color:var(--terra)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{padding:12px;border-radius:8px;background:var(--card2);border:1px solid var(--line)}
.kpi b{display:block;font-family:var(--display);font-size:26px;color:var(--terra-ink)}
.kpi span{font-size:14px;color:var(--soft)}
.rank{width:100%;border-collapse:collapse;font-size:15px}
.rank td,.rank th{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left}
.rank th{font-family:var(--display);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);font-weight:500}
.rank td.r{text-align:right}
.rank th.r{text-align:right}
.medal{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;font-family:var(--display);font-size:11px;background:var(--line)}
.medal.m1{background:#D4AF6A;color:#2E2118}.medal.m4,.medal.m5{background:#8FA37F;color:#FBF7EF}.medal[title]{cursor:help}.medal.m2{background:#C9C2B4;color:#2E2118}.medal.m3{background:#C08A5A;color:#2E2118}

/* tablas de trabajo */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.work{border-collapse:collapse;width:100%;min-width:980px;font-size:15px}
table.work th{position:sticky;top:0;background:var(--walnut);color:#E3C98E;font-family:var(--display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;padding:8px 6px;text-align:left;white-space:nowrap}
table.work td{padding:6px;border-top:1px solid var(--line);vertical-align:middle}
table.work tr:nth-child(even) td{background:var(--card2)}
table.work select,table.work input{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:3px 5px;font-size:15px}
table.work input[type=number]{width:52px;text-align:center;font-family:var(--mono);font-size:13px}
.who{display:flex;gap:8px;align-items:center;white-space:nowrap}
.who img{width:28px;height:35px;object-fit:cover;border-radius:14px 14px 3px 3px;border:1px solid var(--gold)}
.who b{font-family:var(--display);font-size:12px;letter-spacing:.03em}
.tot{font-family:var(--mono);font-size:14px;white-space:nowrap}
.res{font-family:var(--display);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:99px;white-space:nowrap;display:inline-block}
.r-falso{background:var(--bad);color:#FBF7EF}.r-vago{background:var(--line);color:var(--soft)}.r-ok{background:var(--gold);color:#2E2118}.r-det{background:var(--ok);color:#FBF7EF}.r-man{background:var(--terra);color:#FBF7EF}.r-none{color:var(--mute)}
.eff{font-size:14px;color:var(--soft);max-width:240px}
.mini{font-size:13px;color:var(--soft)}
.warn{color:var(--bad);font-size:13px}
.stars{color:var(--gold);letter-spacing:1px;white-space:nowrap}
.chip{display:inline-block;font-size:12px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);margin:1px 2px 1px 0;white-space:nowrap}
.chip.pos{border-color:var(--ok);color:var(--ok)}.chip.neg{border-color:var(--bad);color:var(--bad)}
.roundbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.roundbar button{border:1px solid var(--line);background:var(--card2);padding:5px 12px;border-radius:6px;cursor:pointer;font-family:var(--display);font-size:12px}
.roundbar button[aria-pressed="true"]{background:var(--sage);border-color:var(--sage);color:#FBF7EF}
.rules{font-size:15px;color:var(--soft);font-style:italic}

/* secretos */
.secret{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.sc{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--card2);display:grid;gap:8px;align-content:start}
.sc header{display:flex;gap:10px;align-items:center}
.sc img{width:48px;height:60px;object-fit:cover;border-radius:24px 24px 4px 4px;border:1px solid var(--gold)}
.sc h3{font-size:14px}
.sc label{font-family:var(--display);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage)}
.sc textarea{width:100%;min-height:52px;resize:vertical;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;font-size:15px;color:var(--ink)}
.lock{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--soft)}

pre.out{white-space:pre-wrap;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--mono);font-size:12.5px;max-height:320px;overflow:auto}
.tema{border:1px solid #C4A05A;background:transparent;color:#E3C98E;padding:6px 12px;border-radius:99px;cursor:pointer;font-family:var(--display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.tema:hover{background:rgba(196,160,90,.15)}
.modebox{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.modebox button{border:1px solid #C4A05A;background:transparent;color:#E3C98E;padding:6px 12px;border-radius:99px;cursor:pointer;font-family:var(--display);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.modebox button[aria-pressed="true"]{background:#C4A05A;color:#2E2118}
.modebox select{background:#3d2c20;color:#F3E6CF;border:1px solid #C4A05A;border-radius:6px;padding:4px 8px;font-size:15px}
body.jug header.top{background:#3E5236;border-color:#C4A05A}
.pview{border:1px dashed var(--sage);background:var(--card2);border-radius:8px;padding:10px 14px;font-size:15px}
.me{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.me img{width:110px;height:138px;object-fit:cover;border-radius:55px 55px 8px 8px;border:2px solid var(--gold);box-shadow:0 0 0 4px var(--card),0 0 0 5px var(--gold-soft)}
.me h2{font-size:22px;color:var(--terra-ink)}
.me .script{font-family:var(--script);font-size:30px;color:var(--terra);line-height:1.1}
.neigh{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.neigh span{display:inline-flex;gap:6px;align-items:center;font-size:14px;padding:3px 10px 3px 3px;border-radius:99px;border:1px solid var(--line);background:var(--card2)}
.neigh img{width:24px;height:24px;border-radius:50%;object-fit:cover;border:0;box-shadow:none}
.letter{position:relative;padding:18px 20px;background:var(--card2);border:1px solid var(--gold-soft);border-radius:4px;font-size:17px;line-height:1.5}
.letter::before{content:"";position:absolute;inset:6px;border:1px dashed var(--gold-soft);pointer-events:none}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-items:end}
.calc label{display:grid;gap:4px;font-family:var(--display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage)}
.calc input,.calc select{width:100%;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:16px;font-family:var(--body);text-transform:none;letter-spacing:0;color:var(--ink)}
.bigres{font-family:var(--display);font-size:24px;color:var(--terra-ink)}
.stall.ro{cursor:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--walnut);color:#F3E6CF;padding:8px 16px;border-radius:99px;font-family:var(--display);font-size:12px;letter-spacing:.1em;opacity:0;transition:opacity .25s;pointer-events:none;border:1px solid #C4A05A}
.toast.on{opacity:1}
@media (max-width:640px){.hall{grid-template-columns:1fr}.hall .row-label:last-of-type{display:none}.kpis{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.s-fj{border-left-color:var(--gold-soft)} .s-fj .st{background:var(--gold-soft);color:#2E2118}
.s-fi{border-left-color:var(--bad)} .s-fi .st{background:var(--bad);color:#FBF7EF}
.s-sp{border-left-color:var(--line)} .s-sp .st{background:transparent;color:var(--soft);border:1px dashed var(--mute)}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.pick button{display:flex;align-items:center;gap:6px;padding:3px 9px 3px 3px;border:1px solid var(--line);border-radius:99px;background:var(--card2);font-size:13px;cursor:pointer;color:var(--ink)}
.pick button img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.pick button[aria-pressed="true"]{border-color:var(--terra);background:var(--terra);color:#FBF7EF}
.fhead{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;align-items:center}
.fhead img{width:84px;height:105px;object-fit:cover;border-radius:42px 42px 6px 6px;border:1px solid var(--gold)}
.attrs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:8px}
.attrs label{display:grid;gap:2px;text-align:center;font-family:var(--display);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.attrs input{width:100%;text-align:center;font-size:18px;font-weight:700;padding:4px 0}
.attrs input.nul{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.ctrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:8px}
.ctr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px;align-items:center;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card2)}
.ctr .k{font-size:13px;color:var(--soft);line-height:1.2}
.ctr .k b{display:block;color:var(--ink);font-family:var(--display);font-size:12px;letter-spacing:.04em}
.ctr .v{display:flex;align-items:center;gap:4px}
.ctr .v button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;color:var(--ink);padding:0}
.ctr .v span{min-width:44px;text-align:center;font-weight:700}
.ctr.full .v span{color:var(--bad)}
.ctr input.mx{width:42px;padding:2px 3px;font-size:13px}
.skl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 14px;margin-top:6px}
.skl div{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dotted var(--line);font-size:14px}
.skl div span:last-child{white-space:nowrap;color:var(--soft)} .skl div b{color:var(--ink)}
.skl div.hot{background:color-mix(in srgb,var(--gold) 16%,transparent)}
.trs{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.trs td,.trs th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.trs th{font-family:var(--display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.trs td.c{text-align:center;white-space:nowrap}
.trs tr.esp td:first-child{padding-left:20px;color:var(--soft)}
.mini-in{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.mini-in input,.mini-in select{padding:4px 6px;font-size:14px}
.xbtn{border:0;background:none;color:var(--bad);cursor:pointer;font-size:16px;padding:0 4px}
table.grid{border-collapse:collapse;font-size:12px;min-width:100%}
table.grid th,table.grid td{border:1px solid var(--line);padding:0;text-align:center}
table.grid th{font-family:var(--display);font-size:10px;letter-spacing:.06em;padding:4px 2px;background:var(--card2)}
table.grid td.nm{text-align:left;padding:3px 8px;white-space:nowrap;font-size:13px;position:sticky;left:0;background:var(--card);z-index:1}
table.grid td.sum{padding:3px 6px;font-weight:700;white-space:nowrap}
table.grid button.g{width:30px;height:28px;border:0;cursor:pointer;font-family:var(--display);font-size:10px;font-weight:700;background:transparent;color:var(--soft)}
table.grid button.g.cur{outline:2px solid var(--terra);outline-offset:-2px}
.g-rap{background:var(--ok)!important;color:#FBF7EF!important} .g-nor{background:var(--gold)!important;color:#2E2118!important} .g-len{background:var(--warn)!important;color:#2E2118!important}
.g-fj{background:var(--gold-soft)!important;color:#2E2118!important} .g-fi{background:var(--bad)!important;color:#FBF7EF!important} .g-sp{color:var(--mute)!important}
.g-Y{background:var(--ok)!important;color:#FBF7EF!important} .g-Z{background:var(--gold-soft)!important;color:#2E2118!important} .g-X{background:var(--warn)!important;color:#2E2118!important} .g-F{background:var(--bad)!important;color:#FBF7EF!important}
tr.mrow td{background:color-mix(in srgb,var(--terra) 8%,var(--card))}
table.grid input.fl{width:30px;border:0;border-top:1px solid var(--line);text-align:center;font-size:11px;padding:1px;background:transparent;color:var(--ink)}
.acct{width:100%;border-collapse:collapse;font-size:15px}
.acct td{padding:6px 4px;border-bottom:1px solid var(--line)} .acct td.r{text-align:right;font-weight:700;white-space:nowrap}
.alert{margin-top:10px;padding:9px 12px;border-radius:8px;border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);font-size:14px}
.okbox{margin-top:10px;padding:9px 12px;border-radius:8px;border:1px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent);font-size:14px}
@media (max-width:640px){ .attrs{grid-template-columns:repeat(4,minmax(0,1fr))} .fhead{grid-template-columns:64px minmax(0,1fr)} .fhead img{width:64px;height:80px} }
.mtools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
body.jug .mtools{display:none}
.gate{max-width:380px;margin:30px auto;text-align:center}
.gate input{font-size:22px;text-align:center;letter-spacing:.3em;width:160px;padding:8px;margin:12px 0}
.ro .ctr .v span{min-width:60px}
.pizarra{position:relative;padding:22px 24px 20px;border-radius:10px;background:#2F3B2E;background-image:radial-gradient(circle at 20% 15%,rgba(255,255,255,.06),transparent 40%),radial-gradient(circle at 80% 85%,rgba(255,255,255,.05),transparent 45%);border:10px solid #7A5536;box-shadow:inset 0 0 30px rgba(0,0,0,.35),0 2px 0 rgba(0,0,0,.15);color:#F1EEE4}
.pizarra .pz-k{font-family:var(--display);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#E3C98E;text-align:center}
.pizarra .pz-t{font-family:var(--script);font-size:30px;line-height:1.1;text-align:center;margin:2px 0 10px;color:#FBF7EF}
.pizarra .pz-m{font-family:var(--body);font-size:18px;line-height:1.5;white-space:pre-wrap;text-shadow:0 0 1px rgba(255,255,255,.4)}
.pizarra .pz-d{margin-top:12px;padding-top:10px;border-top:1px dashed rgba(241,238,228,.4);text-align:center;font-size:16px}
.pizarra .pz-d b{color:#F2D38A}
.pizarra .pz-chalk{position:absolute;right:14px;bottom:-10px;width:46px;height:9px;border-radius:3px;background:#F4F1E8;box-shadow:-60px 1px 0 -1px #E9B9A4}
.pz-ed label{display:block;margin-top:8px;font-size:13px;color:var(--soft)} .pz-ed input,.pz-ed textarea{width:100%;box-sizing:border-box;margin-top:3px}
.wrap.ancho{max-width:none}
table.work td:first-child,table.work th:first-child{position:sticky;left:0;z-index:2}
table.work td:first-child{background:var(--card);box-shadow:2px 0 0 var(--line)}
table.work tr:nth-child(even) td:first-child{background:var(--card2)}
table.work th:first-child{z-index:3}
.tw{scrollbar-width:auto;scrollbar-color:var(--terra) var(--card2)}
.tw::-webkit-scrollbar{height:12px}.tw::-webkit-scrollbar-track{background:var(--card2)}.tw::-webkit-scrollbar-thumb{background:var(--terra);border-radius:8px;border:2px solid var(--card2)}

/* tabla del turno */
.tt-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-start;justify-content:space-between}
.tt-st{font-family:var(--display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:99px;border:1px solid var(--gold);color:var(--soft);white-space:nowrap}
.tt-st.on{background:var(--sage);border-color:var(--sage);color:#FBF7EF}
.tt-title{display:block;margin:0 0 14px}
.tt-title span{display:block;margin-bottom:4px}
.tt-title input{width:100%;max-width:520px;padding:8px 12px;border:1px solid var(--gold);border-radius:6px;background:var(--card2);color:var(--ink);font-family:var(--display);font-size:16px;font-weight:600}
.tt-title input:focus,table.ttab input:focus,table.ttab select:focus{outline:2px solid var(--terra);outline-offset:1px}
table.work.ttab{min-width:calc(250px + var(--tt-cols)*210px)}
table.work.ttab th{vertical-align:top;white-space:normal;padding:10px 8px}
table.work.ttab th:first-child{width:250px}
table.work.ttab th input[data-tcampo="columna"]{width:100%;padding:5px 7px;background:rgba(255,255,255,.08);border:1px solid rgba(227,201,142,.55);color:#E3C98E;font-family:var(--display);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.tt-ver{display:flex;align-items:center;gap:6px;margin-top:7px;cursor:pointer;color:#F5EDDD;font-family:var(--body,inherit);font-size:13px;letter-spacing:0;text-transform:none;font-weight:400}
table.work.ttab .tt-ver input{width:15px;height:15px;margin:0;padding:0;accent-color:#C4A05A}
table.work.ttab td input[data-tcampo="celda"]{width:100%;padding:6px 8px;background:var(--card)}
table.work.ttab td.tt-priv input{background:transparent;border-style:dashed;font-style:italic;color:var(--soft)}
table.ttab .who{display:flex;align-items:center;gap:8px}
table.ttab .who select{min-width:0;flex:1;padding:5px}
table.ttab .who img[hidden]{display:none}
.tt-bar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:14px}
.tt-bar>div{display:flex;flex-wrap:wrap;gap:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tt-fila{margin:10px 0 0;padding:10px 14px;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;background:var(--card2);display:grid;grid-template-columns:minmax(90px,auto) minmax(0,1fr);gap:4px 14px}
.tt-fila dt{font-family:var(--display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);padding-top:4px}
.tt-fila dd{margin:0;overflow-wrap:anywhere}
@media (max-width:540px){.tt-fila{grid-template-columns:1fr;gap:0}.tt-fila dd{margin-bottom:6px}}

/* desplegables de Turnos */
.acc{margin-bottom:10px;border:1px solid var(--gold);border-radius:10px;overflow:hidden;background:var(--card)}
.acc-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;width:100%;padding:12px 16px;border:0;background:var(--walnut);color:#F5EDDD;font-family:var(--body);font-size:16px;text-align:left;cursor:pointer}
.acc-h:hover{filter:brightness(1.15)}
.acc-h:focus-visible{outline:2px solid #E3C98E;outline-offset:-3px}
.acc-h b{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#E3C98E}
.acc-n{font-style:italic}
.acc-act{font-family:var(--display);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--terra);color:#FBF7EF}
.acc-e{margin-left:auto;font-size:14px;color:#E3C98E}
.acc-c{width:8px;height:8px;border-right:2px solid #E3C98E;border-bottom:2px solid #E3C98E;transform:rotate(-45deg);transition:transform .15s}
.acc.on .acc-c{transform:rotate(45deg)}
.acc-b{padding:14px}
.acc-b>section.view,.acc-b>.panel{margin:0}
.acc-b .panel{border:0;padding:0;background:transparent}
.tt-sel{display:inline-flex;align-items:center;gap:8px;margin-bottom:6px}
.tt-sel select{padding:4px 8px;border:1px solid var(--gold);border-radius:6px;background:var(--card2);color:var(--ink);font-family:var(--body);font-size:15px}
@media (prefers-reduced-motion:reduce){.acc-c{transition:none}}

/* ediciones para revisar */
.ed-box{margin-top:12px;padding:10px 14px;border:1px solid var(--gold);border-radius:8px;background:var(--card2)}
.ed-box summary{cursor:pointer;font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--terra)}
.ed-row{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:space-between;align-items:center;padding:8px 10px;margin-top:8px;border-radius:6px;border:1px solid var(--line)}
.ed-row.pend{background:#FFF3C4;color:#45372B;border-color:#E3C98E}
.ed-row a{color:var(--terra)}
.ed-acc{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* despensa */
.dp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;margin-top:12px}
.dp{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:176px;padding:12px 8px 10px;background:var(--card2);border:1px solid var(--gold);border-radius:10px;text-align:center;line-height:1.2}
.dp .ingimg{transition:filter .2s,opacity .2s}
.dp b{font-size:15px;color:var(--ink);font-weight:600}
.dp-n{position:absolute;top:6px;left:8px;font-family:var(--display);font-size:11px;color:var(--soft)}
.dp.tomado{border-color:var(--line);background:transparent}
.dp.tomado .ingimg{filter:grayscale(1);opacity:.45}
.dp.tomado b{color:var(--soft);font-weight:500}
.dp-q{display:flex;align-items:center;gap:5px;margin-top:auto;font-size:13px;color:var(--terra-ink,var(--terra))}
.dp-q img{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1px solid var(--gold)}
@media (prefers-reduced-motion:reduce){.dp .ingimg{transition:none}}

.dp-lock{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;margin:10px 0 2px;padding:10px 14px;border-radius:8px;border:1px solid var(--bad);background:rgba(169,71,58,.07)}
.dp-lock b{color:var(--bad)}
.dp-lock.on{border-color:var(--ok);background:rgba(94,119,82,.08)}
.dp-lock.on b{color:var(--ok)}
/* fichas del foro */
.fi-g{display:grid;gap:10px;margin-top:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.fi-c{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--card2)}
.fi-c .who{white-space:normal;flex-wrap:wrap}
.fi-l{display:grid;gap:2px;margin-top:8px;font-size:14px}
.fi-l label{display:flex;gap:6px;align-items:center}
.fi-no{opacity:.5;text-decoration:line-through}
.fi-de{color:var(--soft)}
/* fase de posteo */
.fz{padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;gap:6px;font-size:16px}
.fz-k{font-family:var(--display);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
.fz-f{font-family:var(--display);letter-spacing:.04em}
.fz-rap{border-color:var(--ok);background:rgba(101,127,89,.09)} .fz-rap .fz-f{color:var(--ok)}
.fz-nor{border-color:var(--gold);background:rgba(196,160,90,.10)} .fz-nor .fz-f{color:var(--terra-ink,var(--terra))}
.fz-len{border-color:var(--bad);background:rgba(169,71,58,.08)} .fz-len .fz-f{color:var(--bad)}
.fz-cerrado,.fz-antes{opacity:.85}
.fz-bar{position:relative;display:flex;height:8px;border-radius:99px;overflow:visible;margin-top:4px}
.fz-s{display:block;height:100%} .fz-s:first-child{border-radius:99px 0 0 99px} .fz-s:last-of-type{border-radius:0 99px 99px 0}
.fz-bar .fz-rap{background:var(--ok);border:0} .fz-bar .fz-nor{background:var(--gold);border:0} .fz-bar .fz-len{background:var(--bad);border:0}
.fz-now{position:absolute;top:-4px;width:3px;height:16px;margin-left:-1px;border-radius:2px;background:var(--ink)}
/* Ronda 2 por parejas */
.r2-locks{display:grid;gap:8px}
.r2-par{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
.r2-par.gana{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.r2-h{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center}
.r2-n{font-family:var(--display);font-size:22px;color:var(--terra-ink,var(--terra));min-width:28px}
.r2-q{display:grid;gap:6px}
.r2-tr{flex:1;min-width:200px}
.r2-sc{display:grid;justify-items:end;gap:2px;margin-left:auto;text-align:right}
.r2-sc b{font-family:var(--display);font-size:26px;color:var(--terra-ink,var(--terra));line-height:1}
.r2-sc span{font-size:13px;color:var(--soft)}
table.work.r2-t{min-width:600px}
table.work.r2-t th[scope=row]{background:var(--card);color:inherit;font-family:inherit;font-size:14px;letter-spacing:0;text-transform:none;white-space:normal;min-width:170px}
.r2-in{display:flex;gap:4px}
.r2-no{color:var(--soft);text-align:center}
.dp.r2c{padding-top:24px;min-height:140px}
.dp.r2c:not(.r2-con){opacity:.6}
@media (max-width:640px){.r2-sc{justify-items:start;text-align:left;margin-left:0}}

function grados(total,dif){ // devuelve {pasa, ge, gf}
  const i=ESCALA.indexOf(dif);
  if(total>=dif){ let ge=0; for(let k=i+1;k<ESCALA.length;k++) if(total>=ESCALA[k]) ge++; return {pasa:true,ge,gf:0}; }
  let gf=0; for(let k=i-1;k>=0;k--) if(total<ESCALA[k]) gf++; if(total<ESCALA[0]) gf=Math.max(gf,1);
  return {pasa:false,ge:0,gf};
}
function escalon(total,n){ // Recursos: cuenta como n escalones más alto
  if(!n) return total; let idx=ESCALA.findIndex(v=>v>total); if(idx<0) return total; idx=Math.min(ESCALA.length-1,idx-1+n); return Math.max(total,ESCALA[idx]); }

function r2Auto(id,t){ // Atributo + Habilidad de la tirada, sacado de la ficha (un atributo en blanco cuenta 0)
  const ai=CJ_AT[t.at]; let a=ai==null?null:fAt(id,ai); const blanco=a===''||a==null; if(blanco) a=0;
  let h=0; if(SKN.includes(t.hab)) h=skLv(id,t.hab);
  else { const m=String(t.hab||'').match(/\((.+)\)/); const w=(m?m[1]:String(t.hab||'')).toLowerCase().slice(0,5); h=Math.max(0,...fArts(id).filter(x=>x[0].toLowerCase().includes(w)).map(x=>x[1])); }
  return {v:Number(a)+h,txt:`${t.at} ${blanco?'en blanco (0)':a} + ${t.hab} ${h}`,blanco}; }
function r2Rol(id){ const R=r2(); if(!R) return null; const i=R.pares.findIndex(p=>p.a===id||p.b===id); if(i<0) return null; const p=R.pares[i]; return {i,par:p,rol:p.a===id?'A':'B',comp:p.a===id?p.b:p.a}; }
function r2Tiradas(rol){ return (r2()?.tiradas||[]).filter(t=>t.rol==='AB'||t.rol===rol); }
function r2Mapa(){ // la Cuchara elige primero; después el d15 por orden de tirada; si el camión está tomado, pasa al siguiente libre (del último vuelve al 1)
  const R=r2(); const N=R.trucks.length; const tom={},asig={};
  R.pares.forEach((p,i)=>{ const n=Number(p.elige); if(n>=1&&n<=N&&!tom[n]){ tom[n]=i+1; asig[i]=n; } });
  R.pares.map((p,i)=>({p,i})).filter(x=>asig[x.i]==null&&Number(x.p.d15)>=1).sort((a,b)=>(a.p.t||9e15)-(b.p.t||9e15)||a.i-b.i)
   .forEach(({p,i})=>{ let n=((Number(p.d15)-1)%N)+1; for(let k=0;k<N&&tom[n];k++) n=n%N+1; if(tom[n]) return; tom[n]=i+1; asig[i]=n; });
  return {tom,asig}; }
function r2TruckN(n){ const R=r2(); return R.trucks.find(t=>Number(t.n)===Number(n))||null; }
function r2Truck(i){ const n=r2Mapa().asig[i]; return n?r2TruckN(n):null; }
function r2Pen(truck,t){ return truck&&t.juez?Number(truck.pen?.[t.juez]||0):0; }
function r2Calc(id,t,truck){ const x=S.r2.tir?.[id]?.[t.k]||{}; const au=r2Auto(id,t);
  const mod=x.mod!==''&&x.mod!=null?Number(x.mod):au.v; const ot=Number(x.ot)||0, otC=Math.min(7,ot), pen=r2Pen(truck,t);
  const base={mod,au,ot,otC,pen,capWarn:ot>7,dif:Number(t.dif)||9};
  if(x.dado===''||x.dado==null) return {...base,pend:true};
  const total=mod+Number(x.dado)+otC+pen; const g=grados(total,base.dif); return {...base,total,g,cli:g.pasa?5+10*g.ge:-5*g.gf}; }
function r2Par(i){ const R=r2(); const p=R.pares[i]; const truck=r2Truck(i); let cli=0,hechas=0,tot=0;
  [['A',p.a],['B',p.b]].forEach(([rol,id])=>{ if(!id||!BY[id]) return; r2Tiradas(rol).forEach(t=>{ tot++; const c=r2Calc(id,t,truck); if(!c.pend){ hechas++; cli+=c.cli; } }); });
  cli=Math.max(0,cli); return {truck,cli,st:Math.min(12,Math.floor(cli/10)),hechas,tot,completo:tot>0&&hechas===tot}; }
function r2Ganadores(){ const R=r2(); if(!R) return []; const L=R.pares.map((p,i)=>({i,...r2Par(i)})).filter(x=>x.hechas); if(!L.length) return []; const mx=Math.max(...L.map(x=>x.cli)); return mx>0?L.filter(x=>x.cli===mx).map(x=>x.i):[]; }
function r2Stars(id){ const r=r2Rol(id); if(!r||!(S.r2.tir)) return null; const c=r2Par(r.i); return c.hechas?c.st:null; }
function r2Nom(id){ return BY[id]?BY[id].nombre.split(' ')[0]:'—'; }
function r2Img(t,w,st){ const u=imgurURL(t?.img); return u?`<img alt="" src="${esc(u)}" style="width:${w}px;max-width:100%;border-radius:8px;${st||''}">`:''; }
function r2Cargar(txt){ let o; try{ o=JSON.parse(txt); }catch(e){ toast('Ese texto no es un archivo de ronda válido'); return; }
  if(!o||!Array.isArray(o.trucks)||!Array.isArray(o.pares)||!Array.isArray(o.tiradas)){ toast('Faltan camiones, parejas o tiradas'); return; }
  const malos=o.pares.flatMap(p=>[p.a,p.b]).filter(id=>id&&!BY[id]); if(malos.length){ toast('No conozco a: '+malos.join(', ')); return; }
  o.tir=o.tir||{}; S.r2=o; render(); toast(`Ronda cargada: ${o.trucks.length} opciones y ${o.pares.length} parejas`); }

const TRACKER_URL='https://jesleytherabbit-prog.github.io/magic-chef/';
const H_RAP=24, H_LEN=12; // rápido: primeras 24 h · lento: últimas 12 h antes del cierre
function argDate(v){ if(!v) return null; const d=new Date(/[zZ]|[+-]\d\d:\d\d$/.test(v)?v:v+(v.length===16?':00':'')+'-03:00'); return isNaN(d)?null:d; } // lo que escribe la máster es hora de Argentina
function argInput(d){ if(!d) return ''; const x=new Date(d.getTime()-3*36e5); return x.toISOString().slice(0,16); }
function tiempos(t){ t=t||S.turno; const z=(S.tiempos||{})[t]||{}; const ini=argDate(z.ini)||(S.foro?.[t]?.inicio?new Date(S.foro[t].inicio):null); const lim=argDate(z.lim)||(S.foro?.[t]?.limite?argDate(S.foro[t].limite):null); return {ini,lim,url:z.url||''}; }
function fase(t){ const {ini,lim,url}=tiempos(t); const now=Date.now();
  const finRap=ini?new Date(ini.getTime()+H_RAP*36e5):null, iniLen=lim?new Date(lim.getTime()-H_LEN*36e5):null;
  let f='sin', hasta=null;
  if(lim&&now>=lim) f='cerrado';
  else if(ini&&now<ini) { f='antes'; hasta=ini; }
  else if(finRap&&now<finRap&&(!iniLen||now<iniLen)) { f='rap'; hasta=iniLen&&iniLen<finRap?iniLen:finRap; }
  else if(iniLen&&now>=iniLen) { f='len'; hasta=lim; }
  else if(ini||lim) { f='nor'; hasta=iniLen||null; }
  return {f,hasta,ini,lim,finRap,iniLen,url}; }

// ---------------------------------------------------------------- leer una ficha del foro (texto plano con saltos de línea)
function fichaNz(s){ const M={á:'a',é:'e',í:'i',ó:'o',ú:'u',ü:'u',ñ:'n',à:'a',è:'e',ì:'i',ò:'o',ù:'u',Á:'a',É:'e',Í:'i',Ó:'o',Ú:'u',Ü:'u',Ñ:'n'}; return String(s||'').replace(/[^\x00-\x7f]/g,c=>M[c]||(c.length===1?c.toLowerCase():c)).toLowerCase(); } // misma longitud que el original
const FICHA_LV={desentrenad:0,novat:1,entrenad:1,competent:2,cmpetent:2,expert:4,maestr:7,legendari:9};
function fichaNivel(w){ // «Experto (+4)», «Competente+2», «+1», «0», «-», «III»
  const n=w.match(/\(?\s*\+\s*(\d{1,2})\s*\)?/); if(n) return Number(n[1]);
  const l=w.match(/\b(desentrenad|novat|entrenad|competent|cmpetent|expert|maestr|legendari)[oae]?\b/); if(l) return FICHA_LV[l[1]];
  if(/^\s*[:\-–]?\s*(0|-|—)(\s|$)/.test(w)) return 0; return null; }
function fichaRom(v){ if(/^\d+$/.test(v)) return Number(v); const R={i:1,v:5,x:10}; let t=0; for(let k=0;k<v.length;k++){ const a=R[v[k]],b=R[v[k+1]]||0; t+=a<b?-a:a; } return t; }
function parseFicha(txt){
  const o=String(txt||''), t=fichaNz(o); const out={at:Array(7).fill(null),blanco:[],hb:Array(SKN.length).fill(null),arts:[],leidas:0};
  // el bloque de atributos: el primer «atributos/stats» que tenga «vigor» cerca
  let a0=-1; const ra=/atribut|\bstats\b/g; let m; while((m=ra.exec(t))){ if(/vigor/.test(t.slice(m.index,m.index+400))){ a0=m.index; break; } }
  if(a0<0){ const v=t.search(/vigor\s*[:(→]/); a0=v; } if(a0<0) return out;
  let s0=t.indexOf('atletismo',a0); if(s0<0) s0=a0+600;
  const blk=t.slice(a0,s0);
  const AT=['vigor','destreza','carisma','voluntad','percepcion','inteligencia','poder'];
  AT.forEach((n,i)=>{ const re=new RegExp('(?:^|[^a-z])'+n+'\\s*(?:\\([^)]{0,30}\\))?\\s*(?:\\((?:t|l)\\))?\\s*[:=→\\-–]\\s*([^\\n→❆•⤀❀]{0,24})'); const x=blk.match(re);
    if(x){ const v=x[1].match(/^\s*\+?\s*(\d{1,2}|[ivx]{1,4})\b/); if(v) out.at[i]=fichaRom(v[1]); else out.blanco.push(ATL[i]); return; }
    const y=blk.match(new RegExp('(\\d{1,2})\\s*'+n+'(?![a-z])')); if(y) out.at[i]=Number(y[1]); }); // «3 Vigor 4 Destreza…»

  const sk=t.slice(s0,s0+9000);
  SKN.forEach((n,i)=>{ const k=fichaNz(n); const re=new RegExp('(?:^|[^a-z])'+k.replace(/ /g,'\\s+')+'\\b(?!\\s*\\(per)([^\\n→❆•]{0,46})'); const x=sk.match(re); if(!x) return;
    const v=fichaNivel(x[1].replace(/^\s*\(t\)/,'')); if(v!=null){ out.hb[i]=v; out.leidas++; } });
  // artes y artesanías
  const rart=/\bart(?:e|esania)\b(?:\s*\/\s*artesania)?\s*(?:\(([^()\n]*(?:\([^()\n]*\)[^()\n]*)?)\)|[-–]\s*([^:\n]{2,30}?)\s*:|([^():\n]{2,40}?)\)\s*:|([^:\n]{2,40}?)\s*:)([^\n]*)/g;
  while((m=rart.exec(sk))){ const g=[1,2,3,4].find(k=>m[k]!=null); const raw=m[g]; const st=m.index+m[0].indexOf(raw); const nom=o.slice(s0+st,s0+st+raw.length).replace(/\[\/?\w+[^\]]*\]/g,'').replace(/^\s*[:\-–]\s*/,'').trim();
    if(!nom||/^_+$/.test(nom)||/^\/|^artesan/i.test(fichaNz(nom))) continue; const resto=m[5]; let v=fichaNivel(resto.slice(0,40).split(/[→❆•]/)[0]);
    if(v==null){ const fin=[...resto.matchAll(/(desentrenad|novat|entrenad|competent|expert|maestr|legendari)[oae]?\s*\(?\s*\+?\s*\d?\s*\)?[.\s]*$/g)].pop(); if(fin) v=fichaNivel(fin[0]); } // nivel al final de una descripción
    if(!v) continue; const cap=nom.charAt(0).toUpperCase()+nom.slice(1);
    if(!out.arts.some(z=>fichaNz(z[0])===fichaNz(cap))) out.arts.push([cap,v]); }
  return out; }

function fArts(id){ const u=S.fu?.[id]; return u&&Array.isArray(u.arts)?u.arts:(FICHAS[id]?.arts||[]); }
function fichaDif(id){ const X=S.fimp?.fichas?.[id]; if(!X||!X.P) return []; const P=X.P, ign=X.ign||{}; const out=[];

    P.arts.forEach(([n,v])=>{ const c=cur.find(x=>K(x[0])===K(n)); if(!c||c[1]!==v) out.push({key:'art:'+K(n),k:'art',n:'Arte · '+n,nom:n,de:c?c[1]:null,a:v}); });

document.addEventListener('input',e=>{
  const d=e.target.dataset,t=S.tablas?.[TT()];
  if(!d.tcampo||!t) return;
  if(d.tcampo==='titulo') t.titulo=e.target.value;

  else if(d.tcampo==='pj'){ t.pjs[d.fila]=e.target.value; const im=document.querySelector(`[data-tfoto="${d.fila}"]`); if(im){ im.hidden=!e.target.value; if(e.target.value) im.src=foto(e.target.value); } }
  else if(d.tcampo==='visible'){ t.privadas[d.col]=!e.target.checked; save(); render(); return; }

});
document.addEventListener('click',e=>{
  const accion=e.target.closest('[data-taccion]')?.dataset.taccion;
  if(!accion) return;
  S.tablas=S.tablas||{};
  if(accion==='crear') S.tablas[TT()]=crearTablaTurno();
  const t=S.tablas[TT()];
  prepararFilas(t);
  if(accion==='publicar'){ publicarTabla(t); toast('Tabla publicada en Mi puesto'); }
  if(accion==='retirar') delete S.tablasPublicadas[TT()];
  if(accion==='fila'){ t.filas.push(t.columnas.map(()=>'')); t.pjs.push(''); }
  if(accion==='columna'){ t.columnas.push('Nueva columna'); t.filas.forEach(f=>f.push('')); }
  if(accion==='quitarFila' && t.filas.length && confirm('¿Quitar la última fila de esta tabla?')){ t.filas.pop(); t.pjs.pop(); }
  if(accion==='quitarCol' && t.columnas.length>1 && confirm('¿Quitar la última columna y sus datos?')){ t.columnas.pop(); delete t.privadas[t.columnas.length]; t.filas.forEach(f=>f.pop()); }
  if(accion==='copiar'){
    const fila=(valores,tag)=>'[tr]'+valores.map(v=>'['+tag+']'+(v||' ' )+'[/'+tag+']').join('')+'[/tr]';
    copy('[b]'+t.titulo+'[/b]\n[table]'+fila(t.columnas,'th')+t.filas.map(f=>fila(f,'td')).join('')+'[/table]');
    return;
  }
  render();
});

function posted(s){ return s==='rap'||s==='nor'||s==='len'; }
function pjTurns(id){ let n=0,rap=0,nor=0,len=0,fj=0,fi=0,sp=0; for(let t=1;t<=S.total;t++){ const s=S.posts[t]?.[id]||'pend'; if(s==='rap')rap++; else if(s==='nor')nor++; else if(s==='len')len++; else if(s==='fj')fj++; else if(s==='fi')fi++; else if(s==='sp')sp++; } return {n:rap+nor+len,rap,nor,len,fj,fi,sp}; }
function acct(){
  const umbral=S.total<=25?5:S.total<=50?10:15;
  S.ret=S.ret||{};
  // Reglas: cuenta como jugador completo salvo que se retire antes de llegar al umbral (entonces, medio jugador)
  const pj=PJS.map(p=>{ const c=pjTurns(p.id); const w=S.ret[p.id]?(c.n>=umbral?1:(c.n>0?0.5:0)):1; return {p,...c,w}; });
  const nj=Math.ceil(pj.reduce((a,r)=>a+r.w,0));
  const tramo=Math.max(1,Math.floor((nj+1)/3));
  const vel=nj>=16?10:5; let Fm0=0; for(let t=1;t<=S.total;t++){ if(S.mt[t]?.c==='F') Fm0++; }
  const botePT=5*tramo, masterPT=20+10*tramo;
  let Y=0,Z=0,X=0,Fm=0,fal=0; for(let t=1;t<=S.total;t++){ const m=S.mt[t]||{}; if(m.c==='Y')Y++; else if(m.c==='Z')Z++; else if(m.c==='X'){X++; fal+=Number(m.f)||0;} else if(m.c==='F')Fm++; }
  const tir=Y+X, cierre=S.cfg.cierre&&Z>0?1:0, cuenta=tir+cierre;
  const jugados=Y+Z+X; // el bote cuenta todos los turnos del acontecimiento, con o sin tirada
  const bote=botePT*jugados;
  const maxPrem=Math.floor(nj/4), nPrem=Math.min(5,maxPrem);
  const PCT=[.40,.26,.17,.10,.07].slice(0,nPrem); const sum=PCT.reduce((a,b)=>a+b,0)||1;
  let rep=PCT.map(x=>Math.round(bote*x/sum/5)*5); if(rep.length){ rep[0]+=bote-rep.reduce((a,b)=>a+b,0); }
  const sinPJ=S.cfg.sinPJ?20*(Y+Z+X):0, desc=(Number(S.cfg.desc)||0)*fal;
  const master=masterPT*cuenta+sinPJ-desc;
  const plJ=S.total<15?2:2*Math.floor(S.total/15)+2, plM=S.total<15?3:3*Math.floor(S.total/15)+3;
  pj.forEach(r=>{ r.mf=S.ret[r.p.id]?0:Fm0*20; r.gr=r.n*20+r.rap*vel-r.len*vel+r.mf; });
  return {umbral,jugados,pj,nj,tramo,vel,botePT,masterPT,Y,Z,X,Fm,fal,tir,cierre,cuenta,bote,maxPrem,nPrem,rep,sinPJ,desc,master,plJ,plM};
}

  if(d.t1){ if(S.t1[d.t1]) delete S.t1[d.t1].imp; const r=S.t1[d.t1]=S.t1[d.t1]||{obj:'tuck',met:'inf',acc:d.t1.includes('~')?'A':''}; r[d.k]=val; if(d.k==='acc'&&val==='C') r.obj='tuck'; if(d.k==='acc'||d.k==='met'||d.k==='obj'||d.k==='lazo') delete r.espK; if(d.k==='acc'||d.k==='met'||d.k==='lazo') delete r.genK; if(r.trHecho){ const g=t1Gen(d.t1); if(!g||g.k!==r.trHecho){ const u=fu(idOf(d.t1)); u.tr[r.trHecho]=Math.max(0,(u.tr[r.trHecho]||0)-1); if(g&&!r.lazo){ u.tr[g.k]=(u.tr[g.k]||0)+1; r.trHecho=g.k; } else delete r.trHecho; } } }
  else if(d.t1fama){ const id=d.t1fama, r=S.t1[id]=S.t1[id]||{}; const antes=t1FamaN(id), n=Number(val)||0; r.fama=n; const u=fu(id); u.c.fama=Math.max(0,(u.c.fama||0)+(n-antes));
    for(let i=2;i<=n+1;i++){ if(!S.t1[id+'~'+i]) S.t1[id+'~'+i]={acc:'A',obj:'tuck',met:r.met||'inf'}; } }
  else if(d.r){ const R=((S.rondas[S.ronda]=S.rondas[S.ronda]||{})[d.r]=S.rondas[S.ronda][d.r]||{}); (R[d.f]=R[d.f]||{})[d.k]=val; }
  else if(d.rb){ const R=((S.rondas[S.ronda]=S.rondas[S.ronda]||{})[d.rb]=S.rondas[S.ronda][d.rb]||{}); R[d.k]=val; }
  else if(d.resp){ const R=((S.rondas[S.ronda]=S.rondas[S.ronda]||{})[d.resp]=S.rondas[S.ronda][d.resp]||{}); (R.respeta=R.respeta||{})[d.j]=val; }
  else if(d.cj){ const c=S.caja[d.cj]=S.caja[d.cj]||{}; const pd=(id,n)=>{ const u=fu(id); u.c.pd=Math.max(0,(u.c.pd||0)+n); };
    if(d.k==='robo'){ if(c.robo&&!val){ pd(d.cj,-1); if(c.defendido){ pd(c.robo,-1); c.defendido=false; } } else if(!c.robo&&val) pd(d.cj,1); else if(c.defendido&&val!==c.robo){ pd(c.robo,-1); c.defendido=false; } c.robo=val||''; }
    else if(d.k==='defendido'){ const on=e.target.checked; if(on!==!!c.defendido) pd(c.robo,on?1:-1); c.defendido=on; }
    else { c[d.k]=val; if(d.k==='d50'&&val!==''&&!c.t) c.t=Date.now(); } }
  else if(d.resc){ const R=((S.rondas[S.ronda]=S.rondas[S.ronda]||{})[d.resc]=S.rondas[S.ronda][d.resc]||{}); R.rescate=val; }
  else if(d.cu){ const L=S.cuchara[d.cu]=S.cuchara[d.cu]||[]; if(val) L.push({r:d.rr,g:false}); else S.cuchara[d.cu]=L.filter(x=>x.r!==d.rr); }
  else if(d.cug){ const x=(S.cuchara[d.cug]||[]).find(x=>x.r===d.rr); if(x) x.g=val; }
  else if(d.sec){ S.secretos[d.sec][d.k]=el.value; save(); return; }
  else if(d.fat){ fu(d.fat).at[d.i]=val; }
  else if(d.fmx){ fu(d.fmx).mx[d.k]=val; }
  else if(d.ftx){ fu(d.ftx)[d.k]=el.value; if(d.k!=='img'){ save(); return; } }
  else if(d.fnew){ return; }
  else if(d.mf){ (S.mt[d.mf]=S.mt[d.mf]||{c:'X'}).f=val; }
  else if(d.pz){ (S.pizarra=S.pizarra||{})[d.pz]=el.value; save(); const pv=document.getElementById('pzPrev'); if(pv) pv.innerHTML=pizarra()||'<span class="mini">Vacío: los concursantes no ven nada.</span>'; return; }
  else if(d.t2){ S.t2=S.t2||{}; const r=S.t2[d.t2]=S.t2[d.t2]||{}; r[d.k]=d.k==='v'?(val==='1'):val; if(d.k==='ed'&&val===''){ delete r.fd; } }
  else if(d.r2t&&r2()){ const [id,k]=d.r2t.split('|'); const T=S.r2.tir=S.r2.tir||{}; ((T[id]=T[id]||{})[k]=T[id][k]||{})[d.k]=val; }
  else if(d.r2p&&r2()){ const p=S.r2.pares[+d.r2p]; if(!p) return; if(d.k==='d15'&&val!==''&&(p.d15===''||p.d15==null)) p.t=Date.now(); if(d.k==='d15'&&val==='') delete p.t; p[d.k]=val; }
  else if(d.r2c&&r2()){ const t=S.r2.trucks[+d.r2c]; if(!t) return; if(d.k.startsWith('pen_')){ (t.pen=t.pen||{})[d.k.slice(4)]=val===''?0:val; } else { t[d.k]=d.k==='img'?imgurURL(el.value):el.value; if(d.k==='menu'||d.k==='nombre'||d.k==='comida'){ save(); return; } } }
  else if(d.r2x&&r2()){ const t=S.r2.tiradas[+d.r2x]; if(!t) return; if(d.k==='hab'){ t.hab=el.value; const i=SKN.indexOf(el.value); t.at=i<0?'Voluntad':ATL[SKA[i]]; } else t[d.k]=d.k==='dif'?(Number(val)||9):(val||null); } // el atributo va siempre con su habilidad
  else if(d.fchk){ const [id,key]=d.fchk.split('|'); const X=S.fimp?.fichas?.[id]; if(!X) return; X.ign=X.ign||{}; if(el.checked) delete X.ign[key]; else X.ign[key]=true; }
  else if(d.tz){ const T=(S.tiempos=S.tiempos||{})[S.turno]=(S.tiempos||{})[S.turno]||{}; T[d.tz]=el.value.trim(); }
  else if(d.renu){ S.renuncia[d.renu]=val; }
  else if(d.ret){ S.ret=S.ret||{}; S.ret[d.ret]=val; }
  else if(d.cfg){ S.cfg[d.cfg]=val; }
  else if(el.id==='yoSel'){ S.yo=el.value; }
  else if(d.calc){ S.calc[d.calc]=el.value; }
  else if(el.id==='totalT'){ S.total=Math.max(1,Number(el.value)||20); }
  else return;
  setTimeout(render,0);
});
