<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Magic Chef · El Fogón</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Pinyon+Script&display=swap">
<script>try{ const t=localStorage.getItem('mc-tema'); if(t==='light'||t==='dark') document.documentElement.dataset.theme=t; }catch(e){}</script>
<style>
:root{
  --bg:#EADBC2; --card:#FBF7EF; --card2:#F3EAD8; --ink:#3E3127; --soft:#7A6857;
  --line:rgba(62,49,39,.16); --terra:#A9573A; --terra-ink:#8A452D; --sage:#5E7752; --gold:#B8924A; --gold-soft:#E3C98E;
  --walnut:#2E2118; --on-dark:#F3E6CF; --ok:#5E7752; --warn:#B9822F; --bad:#A9473A;
  --display:'Cinzel',Georgia,serif; --body:'Cormorant Garamond',Georgia,serif; --script:'Pinyon Script',cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1E1712; --card:#2E241C; --card2:#382C22; --ink:#EFE3CF; --soft:#B9A68D; --line:rgba(239,227,207,.14);
  --terra:#D98462; --terra-ink:#E9A182; --sage:#93AE84; --gold:#D4AF6A; --gold-soft:#8F7443; --walnut:#140E0A; --ok:#93AE84; --warn:#D9A552; --bad:#E07A68; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E1712; --card:#2E241C; --card2:#382C22; --ink:#EFE3CF; --soft:#B9A68D; --line:rgba(239,227,207,.14);
  --terra:#D98462; --terra-ink:#E9A182; --sage:#93AE84; --gold:#D4AF6A; --gold-soft:#8F7443; --walnut:#140E0A; --ok:#93AE84; --warn:#D9A552; --bad:#E07A68; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.4;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 22px)}
.wrap{max-width:860px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 70px max(16px,env(safe-area-inset-left,0px))}
button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.05em;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--display);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--sage)}
.mini{font-size:14px;color:var(--soft)}
.num{font-variant-numeric:tabular-nums}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;justify-content:space-between;padding:14px 18px;background:var(--walnut);color:var(--on-dark);border-radius:10px;border:1px solid var(--gold)}
header.top h1{font-size:20px;color:#E3C98E}
header.top .script{font-family:var(--script);font-size:26px;color:#E7A07F;line-height:1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-top:16px}
.panel h2{font-size:16px;color:var(--terra-ink)}
.sub{margin:6px 0 0;color:var(--soft)}
label{display:block;font-size:15px;color:var(--soft)}
select,input[type=number],input[type=text],textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:9px 10px;font-size:18px}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.45;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--terra);outline-offset:1px}
.btn{border:1px solid var(--gold);background:var(--card);padding:9px 14px;border-radius:7px;cursor:pointer;font-family:var(--display);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.btn.primary{background:var(--terra);border-color:var(--terra);color:#FBF7EF}
.btn:hover{border-color:var(--terra)}

/* pantalla de espera */
.espera{text-align:center;padding:40px 18px 34px}
.espera h2{font-size:22px;color:var(--terra-ink)}
.espera p{max-width:440px;margin:10px auto 0;color:var(--soft)}
.olla{width:130px;height:120px;margin:0 auto 6px;position:relative}
.olla .cuerpo{position:absolute;left:14px;right:14px;bottom:6px;height:62px;border-radius:6px 6px 36px 36px;background:linear-gradient(#4a382b,#2e2118);border:2px solid var(--gold)}
.olla .borde{position:absolute;left:6px;right:6px;bottom:62px;height:12px;border-radius:8px;background:#4a382b;border:2px solid var(--gold)}
.olla i{position:absolute;bottom:78px;width:8px;height:30px;border-radius:50%;background:var(--soft);opacity:0;filter:blur(3px);animation:vapor 3.2s ease-in infinite}
.olla i:nth-child(1){left:42px}.olla i:nth-child(2){left:62px;animation-delay:1s}.olla i:nth-child(3){left:82px;animation-delay:2s}
@keyframes vapor{0%{transform:translateY(8px) scaleY(.6);opacity:0}30%{opacity:.55}100%{transform:translateY(-34px) scaleY(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.olla i{animation:none;opacity:.25}}

/* quién soy */
.yo{display:flex;gap:14px;align-items:center}
.yo img{width:62px;height:78px;object-fit:cover;object-position:center top;border-radius:8px;border:2px solid var(--gold);background:var(--card2);flex:none}
.yo .tag{font-family:var(--script);font-size:24px;color:var(--terra);line-height:1}
.yo h2{font-size:20px}

/* ingrediente */
.ing{display:flex;gap:14px;align-items:flex-start}
.ing img{width:92px;height:92px;object-fit:contain;flex:none;border-radius:10px;background:var(--card2);border:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:14px;border:1px solid var(--line);background:var(--card2);margin:3px 4px 0 0}
.chip.pos{border-color:var(--ok);color:var(--ok)}
.chip.neg{border-color:var(--bad);color:var(--bad)}
.chip.off{opacity:.45;text-decoration:line-through}
.chip input{width:auto;margin:0;accent-color:var(--terra)}

/* fases */
.fase{border-left:4px solid var(--gold);padding-left:14px;margin-top:18px}
.fase h3{font-size:15px;color:var(--terra-ink)}
.fase .reto{color:var(--soft);font-size:16px}
.campos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
@media (max-width:520px){.campos{grid-template-columns:1fr 1fr}.campos .c3{grid-column:1/-1}}
.res{margin-top:12px;padding:12px 14px;border-radius:9px;background:var(--card2);border:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px}
.res .tot{font-family:var(--display);font-size:30px;line-height:1;color:var(--terra-ink)}
.res .estr{font-size:26px;letter-spacing:.08em;color:var(--gold)}
.res .ver{font-weight:700}
.res.ok .ver{color:var(--ok)} .res.ko .ver{color:var(--bad)}
.aviso{color:var(--warn);font-size:15px;margin-top:6px}
.total-est{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.total-est b{font-family:var(--display);font-size:28px;color:var(--terra-ink)}
details summary{cursor:pointer;color:var(--terra-ink);font-family:var(--display);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.fila-btn{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center}
.pie{margin-top:22px;text-align:center}
[hidden]{display:none!important}
</style>
</head>

  <header class="top"><h1>Magic Chef</h1><span class="script">El Fogón</span></header>
  <main id="app"><div class="panel espera"><p>Encendiendo el fuego…</p></div></main>
  <p class="mini pie" id="pie"></p>
</div>

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sg=n=>(n>0?'+':n<0?'−':'')+Math.abs(n);
const foto=(id,p)=>(p&&p.img)||FOTOS[id]||('data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 120"><rect width="96" height="120" fill="#F3EAD8"/><text x="48" y="78" font-family="Georgia,serif" font-size="54" font-weight="700" text-anchor="middle" fill="#B8924A">${esc((p&&p.n||'?')[0])}</text></svg>`));

let DATA=null, YO=null, AT=0; const ST={};
const LS='mc-fogon-v1';
function leer(){ try{ const o=JSON.parse(localStorage.getItem(LS)||'{}'); return o||{}; }catch(e){ return {}; } }
function guardar(){ try{ const o=leer(); o.yo=YO; o.st=o.st||{}; o.st[DATA.ronda+'-'+DATA.turno]=ST; localStorage.setItem(LS,JSON.stringify(o)); }catch(e){} }

async function cargar(){ const r=await fetch(URL_DOC,{cache:'no-store'}); if(r.status===404) return null; if(!r.ok) throw new Error(r.status); const j=await r.json(); return JSON.parse(j.fields.d.stringValue); }

function espera(msg,sub){ $('#app').innerHTML=`<div class="panel espera"><div class="olla" aria-hidden="true"><i></i><i></i><i></i><div class="borde"></div><div class="cuerpo"></div></div><h2>${esc(msg)}</h2><p>${esc(sub)}</p></div>`; }

function hora(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return '';
  const f=(tz,o)=>new Intl.DateTimeFormat('es',{timeZone:tz,...o}).format(d);
  const dia=f('America/Argentina/Buenos_Aires',{weekday:'long',day:'numeric',month:'long'});
  const h=tz=>f(tz,{hour:'2-digit',minute:'2-digit',hour12:false});
  return `${dia}, ${h('America/Argentina/Buenos_Aires')} Argentina (${h('Europe/Madrid')} España, ${h('America/Mexico_City')} México)`; }
function faltan(iso){ if(!iso) return ''; const ms=new Date(iso)-Date.now(); if(isNaN(ms)) return ''; if(ms<=0) return 'El turno ya cerró.';
  const h=Math.floor(ms/36e5), m=Math.floor(ms%36e5/6e4); return h>=48?`Faltan ${Math.floor(h/24)} días y ${h%24} h.`:`Faltan ${h} h ${m} min.`; }

function st(id,k){ return (ST[id]=ST[id]||{})[k]=(ST[id][k]||{}); }
function cap(t){ return t?t[0].toUpperCase()+t.slice(1):''; }
function fasesDe(p){ return p.fases||DATA.fases; }
function evRes(p,id){ const e=p.ev; if(!e) return null; const s=st(id,'ev'); const mod=(s.mod!==undefined&&s.mod!=='')?Number(s.mod):e.mod;
  const dado=e.dado!=null?e.dado:((s.dado===undefined||s.dado==='')?null:Number(s.dado));
  if(dado==null) return {mod,dado:null,e};
  const total=mod+dado; const g=grados(total,e.dif); return {mod,dado,total,g,pasa:g.pasa,e}; }
function cmpRes(p,id){ const r=p.rt; if(!r||r.sinComp) return null; const s=st(id,'rt'); const mod=(s.mod!==undefined&&s.mod!=='')?Number(s.mod):r.mod;
  const dado=r.dado!=null?r.dado:((s.dado===undefined||s.dado==='')?null:Number(s.dado));
  if(dado==null) return {mod,dado:null,r};
  const total=mod+dado; const g=grados(total,r.dif); return {mod,dado,total,g,sync:g.pasa,r}; }
function cmpMods(p,id,fk){ const q=cmpRes(p,id); if(!q||q.dado==null) return []; const r=q.r; if(r.sin&&r.sin[fk]) return []; const L=[];
  if(q.sync){ if(fk==='base'){ L.push({v:r.bonif,t:cap(r.lbl)+' '+r.nombre.split(' ')[0]}); const ge=Math.min(2,q.g.ge); if(ge) L.push({v:ge,t:'Sincronía ('+ge+(ge>1?' grados':' grado')+')'}); } if(r.trucoFase===fk) L.push({v:2,t:'Truco ('+r.truco+')'}); }
  else if(fk==='base'||fk==='toque') L.push({v:-2,t:'Desincronizado ('+r.lbl+')'});
  return L; }
function evEf(p,id,fk){ const q=evRes(p,id); if(!q||q.dado==null||q.pasa||!(q.e.fase===fk||q.e.fase==='todas')) return {g:0,m:0}; return q.e.ef==='grado'?{g:1,m:0}:{g:0,m:Number(q.e.ef)||0}; }
function calc(p,fz,id){ const x=p.f[fz.k]; const s=st(id,fz.k); const mod=(s.mod!==undefined&&s.mod!=='')?Number(s.mod):x.mod;
  let suma=0; x.mods.forEach((m,i)=>{ const on=(s.off&&(i in s.off))?s.off[i]:m.on; if(on) suma+=m.v; });
  const rm=cmpMods(p,id,fz.k); rm.forEach(m=>{ suma+=m.v; }); const ef=evEf(p,id,fz.k); suma+=ef.m;
  const otros=Number(s.otros)||0; const raw=suma+x.extra+otros; const ext=Math.min(7,raw);
  const dado=(s.dado===undefined||s.dado==='')?null:Number(s.dado);
  const o={mod,suma,otros,raw,ext,tope:raw>7,dado,rm,evM:ef.m,evG:ef.g};
  if(dado==null) return o;
  o.total=mod+dado+ext; o.g=grados(o.total,fz.dif); o.est=o.g.pasa?Math.min(3,1+o.g.ge):0; if(ef.g&&o.est>0) o.est=Math.max(0,o.est-ef.g);
  o.cli=o.g.pasa?5+10*o.g.ge:-5*o.g.gf; return o; }

function plantilla(id){ const p=DATA.pj[id]; let t=`[b]${DATA.titulo} · ${p.n}[/b]\n`;
  if(p.ing) t+=`Ingrediente: ${p.ing.nombre} (nº ${p.ing.n})\n`;
  const q=cmpRes(p,id); if(q&&q.dado!=null) t+=`${cap(q.r.lbl)}: ${q.r.nombre} (nº ${q.r.n}): Carisma + Coordinación = ${q.mod}, dado ${q.dado} = [b]${q.total}[/b] contra ${q.r.dif}: ${q.sync?'sincronizados':'desincronizados'}\n`;
  const v=evRes(p,id); if(v&&v.dado!=null) t+=`Imprevisto «${v.e.titulo}»: ${v.e.at} + ${v.e.hab} = ${v.mod}, dado ${v.dado} = [b]${v.total}[/b] contra ${v.e.dif}: ${v.pasa?'superado':'fallado'}\n`;
  t+='\n';
  fasesDe(p).forEach(fz=>{ const c=calc(p,fz,id); const x=p.f[fz.k];
    if(c.dado==null){ t+=`[b]${fz.nombre}[/b] (${fz.juez}): falta el dado\n`; return; }
    const ms=x.mods.filter((m,i)=>{ const s=st(id,fz.k); return (s.off&&(i in s.off))?s.off[i]:m.on; }).map(m=>`${sg(m.v)} ${m.t}`);
    c.rm.forEach(m=>ms.push(`${sg(m.v)} ${m.t}`)); if(c.evM) ms.push(`${sg(c.evM)} imprevisto`);
    if(x.extra) ms.push(`${sg(x.extra)} extra del máster`); if(c.otros) ms.push(`${sg(c.otros)} otros`);
    t+=`[b]${fz.nombre}[/b] (${fz.juez}): ${fz.at} + ${fz.hab} = ${c.mod}, dado ${c.dado}${c.ext?`, modificadores ${sg(c.ext)}${c.tope?' (tope +7)':''}`:''} = [b]${c.total}[/b] contra ${fz.dif}\n`;
    if(c.evG&&c.est!=null) t+=`[i]El imprevisto quita un grado de éxito.[/i]\n`;
    if(ms.length) t+=`[i]${ms.join(' · ')}[/i]\n`; });
  return t.trim(); }

function dynChips(p,fz,id){ const x=p.f[fz.k]; const rm=cmpMods(p,id,fz.k).map(m=>`<span class="chip ${m.v>0?'pos':'neg'}">${sg(m.v)} ${esc(m.t)}</span>`).join(''); const em=evEf(p,id,fz.k).m; const ev=em?`<span class="chip neg">${sg(em)} imprevisto</span>`:'';
  return rm+ev+((!x.mods.length&&!x.extra&&!rm&&!ev)?'<span class="mini">Sin modificadores por ahora.</span>':''); }
function faseHTML(p,fz,id){ const x=p.f[fz.k]; const s=st(id,fz.k);
  const chips=x.mods.map((m,i)=>{ const on=(s.off&&(i in s.off))?s.off[i]:m.on;
    const cls=`chip ${m.v>0?'pos':'neg'} ${on?'':'off'}`;
    return m.c?`<label class="${cls}" style="color:inherit"><input type="checkbox" data-mod="${fz.k}|${i}" ${on?'checked':''}> ${sg(m.v)} ${esc(m.t)} <span class="mini">(si respetas el gusto)</span></label>`:`<span class="${cls}">${sg(m.v)} ${esc(m.t)}</span>`; }).join('');
  return `<div class="fase" data-fase="${fz.k}"><h3>${esc(fz.nombre)} · ${esc(fz.juez)}</h3>
    <div class="reto">${esc(fz.at)} + ${esc(fz.hab)} contra <b>${fz.dif}</b></div>
    <div class="campos">
      <label>Atributo + Habilidad<input type="number" inputmode="numeric" data-in="${fz.k}|mod" value="${s.mod??''}" placeholder="${x.mod}"></label>
      <label>Dado del foro<input type="number" inputmode="numeric" min="1" max="10" data-in="${fz.k}|dado" value="${s.dado??''}" placeholder="1 a 10"></label>
      <label class="c3">Otros (Cuchara de Oro, apoyos…)<input type="number" inputmode="numeric" data-in="${fz.k}|otros" value="${s.otros??''}" placeholder="0"></label></div>
    <div class="mini" style="margin-top:6px">En tu ficha: ${esc(x.txt)}.${x.blanco?' <span class="aviso">Tu ficha tiene el atributo en blanco y cuenta 0: avísale a Hana.</span>':''}</div>
    <div style="margin-top:6px">${chips}<span id="dyn-${fz.k}">${dynChips(p,fz,id)}</span>${x.extra?`<span class="chip ${x.extra>0?'pos':'neg'}">${sg(x.extra)} extra de Hana</span>`:''}</div>
    <div class="res" id="res-${fz.k}" aria-live="polite"></div></div>`; }

function pintarExtras(id){ const p=DATA.pj[id];
  const q=cmpRes(p,id); const er=$('#res-rt'); if(er&&q){ if(q.dado==null){ er.className='res'; er.innerHTML=`<span class="mini">Escribe el dado de sincronía que sacaste y te digo cómo te fue con tu ${q.r.lbl}.</span>`; }
    else { const g=q.g; const ge=Math.min(2,g.ge); er.className='res '+(q.sync?'ok':'ko'); er.innerHTML=`<span class="tot num">${q.total}</span><span class="mini">contra ${q.r.dif}</span><span class="ver">${q.sync?`¡Sincronizados!${ge?` +${ge} a la Base por la sincronía.`:''}`:'Desincronizados'}</span>`; } }
  const v=evRes(p,id); const ee=$('#res-ev'); if(ee&&v){ if(v.dado==null){ ee.className='res'; ee.innerHTML='<span class="mini">Escribe el dado del imprevisto y te digo cómo te fue.</span>'; }
    else { ee.className='res '+(v.pasa?'ok':'ko'); ee.innerHTML=`<span class="tot num">${v.total}</span><span class="mini">contra ${v.e.dif}</span><span class="ver">${v.pasa?'Superado: no pierdes nada':'Fallado: '+(v.e.ef==='grado'?'pierdes un grado de éxito':'tienes '+sg(v.e.ef)+' al total')+' en '+(v.e.fase==='todas'?'todas las fases':'la fase '+v.e.faseN)}</span>`; } } }
function pintarRes(id){ const p=DATA.pj[id]; let suma=0, hay=false; const r2=DATA.tipo==='r2'; pintarExtras(id);
  fasesDe(p).forEach(fz=>{ const c=calc(p,fz,id); const dy=$('#dyn-'+fz.k); if(dy) dy.innerHTML=dynChips(p,fz,id); const el=$('#res-'+fz.k); if(!el) return;
    if(c.dado==null){ el.className='res'; el.innerHTML=`<span class="mini">Escribe el dado que sacaste en el foro y te digo cómo te fue.</span>`; return; }
    hay=true; suma+=r2?c.cli:c.est; const g=c.g;
    const txt=g.pasa?(g.ge?`Superada con ${g.ge} ${g.ge>1?'grados':'grado'} de éxito`:'Superada'):(g.gf?`Fallada con ${g.gf} ${g.gf>1?'grados':'grado'} de fracaso`:'Fallada');
    el.className='res '+(g.pasa?'ok':'ko');
    el.innerHTML=`<span class="tot num">${c.total}</span><span class="mini">contra ${fz.dif}</span><span class="ver">${txt}</span>${r2?`<span class="estr num" aria-label="${c.cli} clientes">${c.cli>0?'+':''}${c.cli} clientes</span>`:`<span class="estr" aria-label="${c.est} de 3 estrellas">${'★'.repeat(c.est)}${'☆'.repeat(3-c.est)}</span>`}${c.evG&&g.pasa?'<span class="aviso" style="flex-basis:100%">El imprevisto te quita un grado de éxito en esta fase.</span>':''}${c.tope?'<span class="aviso" style="flex-basis:100%">Los modificadores externos llegan al tope de +7.</span>':''}`; });
  $('#estTot').innerHTML=hay?`<b class="num">${r2?(suma>0?'+':'')+suma+' clientes':suma+' ★'}</b>`:'<span class="mini">—</span>';
  $('#plant').value=plantilla(id); }

function pintar(){ if(!DATA) return; const ids=Object.keys(DATA.pj).sort((a,b)=>DATA.pj[a].n.localeCompare(DATA.pj[b].n,'es'));
  if(!YO||!DATA.pj[YO]){ YO=null; }
  const sel=`<div class="panel"><div class="eyebrow">${esc(DATA.rondaN)} · Turno ${DATA.turno}</div><h2>${esc(DATA.titulo)}</h2>
    ${DATA.sub?`<p class="sub">${esc(DATA.sub)}</p>`:''}
    ${DATA.lim?`<p class="sub"><b>Cierra:</b> ${esc(hora(DATA.lim))}. <span class="mini">${esc(faltan(DATA.lim))}</span></p>`:''}
    <label style="margin-top:12px">¿Quién eres?<select id="yoSel"><option value="">Elige tu nombre</option>${ids.map(i=>`<option value="${i}" ${i===YO?'selected':''}>${esc(DATA.pj[i].n)}</option>`).join('')}</select></label></div>`;
  if(!YO){ $('#app').innerHTML=sel; return; }
  const p=DATA.pj[YO]; const i=p.ing; const R2=DATA.tipo==='r2';
  const ingP=i?`<div class="panel"><div class="eyebrow">Tu caja · nº ${i.n}</div><div class="ing">${i.img?`<img alt="" src="${esc(i.img)}" onerror="this.style.display='none'">`:''}<div><h2>${esc(i.nombre)}</h2><p class="sub" style="margin-top:4px">${esc(i.desc)}</p>
    <p style="margin:8px 0 0">Para domarlo: <b>${esc(i.tirada)}</b> contra <b>${i.dif}</b>. Si lo consigues <span class="chip pos">${sg(i.ok)} Base</span> y si no <span class="chip neg">${sg(i.ko)} Base</span>.</p>
    ${i.pend?'<p class="mini" style="margin:6px 0 0">Hana todavía no resolvió tu tirada con el ingrediente.</p>':`<p style="margin:6px 0 0">Sacaste <b>${i.total}</b>: <b style="color:var(--${i.pasa?'ok':'bad'})">${i.pasa?'¡Domado!':'Se rebeló'}</b></p>`}</div></div></div>`
    :(DATA.ronda==='R1'?`<div class="panel"><p class="sub">Todavía no abriste tu Caja Misteriosa, así que no tienes ingrediente asignado.</p></div>`:'');
  const pn=p.panel?`<div class="panel"><div class="eyebrow">${esc(p.panel.eyebrow)}</div><h2>${esc(p.panel.titulo)}</h2><p class="sub" style="margin-top:4px">${esc(p.panel.sub)}</p>${p.panel.img?`<img alt="" src="${esc(p.panel.img)}" style="width:180px;max-width:100%;border-radius:8px;margin-top:8px" onerror="this.style.display='none'">`:''}${p.panel.menu?`<p style="white-space:pre-wrap;margin:10px 0 0"><b>Menú</b>\n${esc(p.panel.menu)}</p>`:''}</div>`:(p.sinPar?`<div class="panel"><p class="sub">No tienes pareja en esta ronda.</p></div>`:'');
  const rt=p.rt?(p.rt.sinComp?`<div class="panel"><div class="eyebrow">Tu sorteo</div><p class="sub">Todavía no tiraste el d20 en el foro.</p></div>`
    :`<div class="panel"><div class="eyebrow">Tu ${esc(p.rt.lbl)} · nº ${p.rt.n}</div><h2>${esc(p.rt.nombre)}</h2><p class="sub" style="margin-top:4px">${esc(p.rt.edicion)}</p><p style="margin:8px 0 0">${esc(p.rt.desc)}</p><p style="margin:6px 0 0"><b>Cómo te guía:</b> ${esc(p.rt.guia)}</p><p style="margin:6px 0 0"><b>Su manía:</b> ${esc(p.rt.mania)}</p>
      <p style="margin:8px 0 0">Para sincronizarte: <b>Carisma + Coordinación</b> contra <b>${p.rt.dif}</b>. Si lo logras: <span class="chip pos">+${p.rt.bonif} Base</span> <span class="chip pos">+2 ${esc(p.rt.truco)}</span> y +1 a la Base por grado de éxito (máx. +2). Si fallas: <span class="chip neg">−2 Latrocinio y Cocina</span>.</p>
      <div class="campos" style="margin-top:8px"><label>Atributo + Habilidad<input type="number" inputmode="numeric" data-in="rt|mod" value="${st(YO,'rt').mod??''}" placeholder="${p.rt.mod}"></label><label>Dado de sincronía<input type="number" inputmode="numeric" min="1" max="10" data-in="rt|dado" value="${p.rt.dado!=null?p.rt.dado:(st(YO,'rt').dado??'')}" ${p.rt.dado!=null?'readonly':''} placeholder="1 a 10"></label></div>
      <div class="mini" style="margin-top:6px">En tu ficha: ${esc(p.rt.txt)}.${p.rt.blanco?' <span class="aviso">Tu ficha tiene el atributo en blanco y cuenta 0: avísale a Hana.</span>':''}</div><div class="res" id="res-rt" aria-live="polite"></div></div>`):'';
  const ev=p.ev?`<div class="panel"><div class="eyebrow">Imprevisto · fase ${esc(p.ev.faseN)}</div><h2>${esc(p.ev.titulo)}</h2>${p.ev.escena?`<p style="margin:8px 0 0">${esc(p.ev.escena)}</p>`:''}
      <p style="margin:8px 0 0">Tu tirada: <b>${esc(p.ev.at)} + ${esc(p.ev.hab)}</b> contra <b>${p.ev.dif}</b>. Si la superas, no pasa nada. Si la fallas, ${p.ev.ef==='grado'?'pierdes un grado de éxito':'tienes '+sg(p.ev.ef)+' al total'} en ${p.ev.fase==='todas'?'todas las fases':'la fase '+esc(p.ev.faseN)}.</p>
      <div class="campos" style="margin-top:8px"><label>Atributo + Habilidad<input type="number" inputmode="numeric" data-in="ev|mod" value="${st(YO,'ev').mod??''}" placeholder="${p.ev.mod}"></label><label>Dado del imprevisto<input type="number" inputmode="numeric" min="1" max="10" data-in="ev|dado" value="${p.ev.dado!=null?p.ev.dado:(st(YO,'ev').dado??'')}" ${p.ev.dado!=null?'readonly':''} placeholder="1 a 10"></label></div>
      <div class="mini" style="margin-top:6px">En tu ficha: ${esc(p.ev.txt)}.${p.ev.blanco?' <span class="aviso">Tu ficha tiene el atributo en blanco y cuenta 0: avísale a Hana.</span>':''}</div><div class="res" id="res-ev" aria-live="polite"></div></div>`:'';
  $('#app').innerHTML=sel+`<div class="panel"><div class="yo"><img alt="" src="${esc(foto(YO,p))}"><div><div class="tag">${esc(p.tag)}</div><h2>${esc(p.n)}</h2></div></div></div>`+ingP+pn+rt+ev+
   (p.sinPar?'':`<div class="panel"><h2>Tus tiradas</h2><p class="sub">Tira los dados en el foro y escribe aquí el resultado. Los modificadores ya están sumados.</p>${fasesDe(p).map(fz=>faseHTML(p,fz,YO)).join('')}
     <div class="panel total-est" style="margin-top:20px"><span>${R2?'Clientes que sumas (provisorio)':'Estrellas de este turno (provisorio)'}</span><span id="estTot"></span></div>
     <p class="mini">Esto es una cuenta orientativa: el veredicto lo da Hana cuando lee tu post.</p></div>`)+
   `<div class="panel"><h2>Para tu post</h2><p class="sub">Copia este texto debajo de tu narración.</p><textarea id="plant" rows="8" readonly></textarea>
     <div class="fila-btn"><button class="btn primary" id="cop">Copiar texto</button><span class="mini" id="copMsg"></span></div></div>
    <div class="panel"><details><summary>Reglas rápidas</summary><p class="sub">Tirada: d10 + Atributo + Habilidad + modificadores, contra la dificultad de la fase. Los modificadores externos suman como máximo +7. La escala de resultados es 5, 7, 9, 12, 15, 18, 21 y 25: cada escalón que superas es un grado de éxito, y cada escalón por debajo, un grado de fracaso. Estrellas por fase: 0 si fallas, 1 si superas y 1 más por cada grado de éxito, hasta 3.</p></details></div>`;
  pintarRes(YO); }

document.addEventListener('change',e=>{ const el=e.target;
  if(el.id==='yoSel'){ YO=el.value||null; guardar(); pintar(); return; }
  if(el.dataset.mod){ const [k,i]=el.dataset.mod.split('|'); const s=st(YO,k); (s.off=s.off||{})[i]=el.checked; guardar(); pintar(); } });
document.addEventListener('input',e=>{ const el=e.target; if(!el.dataset.in) return; const [k,f]=el.dataset.in.split('|'); st(YO,k)[f]=el.value; guardar(); pintarRes(YO); });
document.addEventListener('click',e=>{ if(e.target.id!=='cop') return; const t=$('#plant'); const ok=()=>{ $('#copMsg').textContent='Copiado'; setTimeout(()=>{ const m=$('#copMsg'); if(m) m.textContent=''; },1600); };
  (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(ok).catch(()=>{ t.removeAttribute('readonly'); t.select(); try{ document.execCommand('copy'); ok(); }catch(x){ $('#copMsg').textContent='Selecciona el texto y cópialo a mano'; } t.setAttribute('readonly',''); }); });

async function ciclo(primera){
  try{ const o=await cargar();
    if(!o||!o.fogon||!o.fogon.vis){ DATA=null; espera('Los fogones todavía están apagados','Hana enciende el fuego cuando empieza el turno. Esta página se abre sola, no hace falta recargar.'); }
    else if((o.at!==AT||primera)&&!(document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.in&&!primera)){ AT=o.at; const nuevo=!DATA||DATA.turno!==o.fogon.turno||DATA.ronda!==o.fogon.ronda; DATA=o.fogon;
      if(nuevo){ const g=leer(); const prev=(g.st||{})[DATA.ronda+'-'+DATA.turno]||{}; Object.keys(ST).forEach(k=>delete ST[k]); Object.assign(ST,prev); if(primera&&g.yo) YO=g.yo; }
      pintar(); }
    $('#pie').textContent=o&&o.at?'Datos de '+new Date(o.at).toLocaleString('es',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
  }catch(e){ if(!DATA) espera('No pude conectar con la cocina','Revisa tu conexión: lo intento de nuevo en unos segundos.'); }
}
ciclo(true); setInterval(()=>ciclo(false),45000);
</script>
