<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Magic Chef · El Food Truck</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Pinyon+Script&family=Pixelify+Sans:wght@500;700&display=swap">
<script>try{ const t=localStorage.getItem('mc-tema'); if(t==='light'||t==='dark') document.documentElement.dataset.theme=t; }catch(e){}</script>
<style>
:root{
  --bg:#EADBC2; --card:#FBF7EF; --card2:#F3EAD8; --ink:#3E3127; --soft:#7A6857;
  --line:rgba(62,49,39,.16); --terra:#A9573A; --terra-ink:#8A452D; --sage:#5E7752; --gold:#B8924A; --gold-soft:#E3C98E;
  --walnut:#2E2118; --on-dark:#F3E6CF; --ok:#5E7752; --warn:#B9822F; --bad:#A9473A;
  --display:'Cinzel',Georgia,serif; --body:'Cormorant Garamond',Georgia,serif; --script:'Pinyon Script',cursive; --pix:'Pixelify Sans',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1E1712; --card:#2E241C; --card2:#382C22; --ink:#EFE3CF; --soft:#B9A68D; --line:rgba(239,227,207,.14);
  --terra:#D98462; --terra-ink:#E9A182; --sage:#93AE84; --gold:#D4AF6A; --gold-soft:#8F7443; --walnut:#140E0A; --ok:#93AE84; --warn:#D9A552; --bad:#E07A68; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E1712; --card:#2E241C; --card2:#382C22; --ink:#EFE3CF; --soft:#B9A68D; --line:rgba(239,227,207,.14);
  --terra:#D98462; --terra-ink:#E9A182; --sage:#93AE84; --gold:#D4AF6A; --gold-soft:#8F7443; --walnut:#140E0A; --ok:#93AE84; --warn:#D9A552; --bad:#E07A68; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.4;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 22px)}
.wrap{max-width:860px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 70px max(16px,env(safe-area-inset-left,0px))}
button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.05em;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--display);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--sage)}
.mini{font-size:14px;color:var(--soft)}
.num{font-variant-numeric:tabular-nums}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;justify-content:space-between;padding:14px 18px;background:var(--walnut);color:var(--on-dark);border-radius:10px;border:1px solid var(--gold)}
header.top h1{font-size:20px;color:#E3C98E}
header.top .script{font-family:var(--script);font-size:26px;color:#E7A07F;line-height:1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-top:16px}
.panel h2{font-size:16px;color:var(--terra-ink)}
.sub{margin:6px 0 0;color:var(--soft)}
.btn{border:1px solid var(--gold);background:var(--card);padding:9px 14px;border-radius:7px;cursor:pointer;font-family:var(--display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;min-height:40px}
.btn.primary{background:var(--terra);border-color:var(--terra);color:#FBF7EF}
.btn:hover{border-color:var(--terra)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.pair:focus-visible,.ev:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:14px;border:1px solid var(--line);background:var(--card2);margin:3px 4px 0 0}
.chip.pos{border-color:var(--ok);color:var(--ok)} .chip.neg{border-color:var(--bad);color:var(--bad)}
[hidden]{display:none!important}

/* espera */
.espera{text-align:center;padding:40px 18px 34px}
.espera h2{font-size:22px;color:var(--terra-ink)}
.espera p{max-width:440px;margin:10px auto 0;color:var(--soft)}
.mini-truck{width:120px;height:64px;margin:0 auto 10px;position:relative;image-rendering:pixelated}
.mini-truck .b{position:absolute;left:0;top:14px;width:84px;height:36px;background:#a9573a;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.mini-truck .c{position:absolute;left:84px;top:26px;width:30px;height:24px;background:#a9573a;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.mini-truck .w{position:absolute;left:94px;top:30px;width:14px;height:10px;background:#9fc4e6}
.mini-truck .v{position:absolute;left:10px;top:22px;width:50px;height:14px;background:#ffcf7a}
.mini-truck .a{position:absolute;left:6px;top:16px;width:58px;height:6px;background:repeating-linear-gradient(90deg,#f3e6cf 0 6px,#5e7752 6px 12px)}
.mini-truck .r1,.mini-truck .r2{position:absolute;top:44px;width:16px;height:16px;border-radius:50%;background:#1a1a22;border:3px solid #8c8c9a;animation:rueda 1.1s steps(4) infinite}
.mini-truck .r1{left:14px}.mini-truck .r2{left:88px}
@keyframes rueda{to{transform:rotate(90deg)}}
@media (prefers-reduced-motion:reduce){.mini-truck .r1,.mini-truck .r2{animation:none}}

/* selector de parejas */
.pairs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pair{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card2);border-radius:99px;padding:4px 12px 4px 5px;cursor:pointer;min-height:40px;font-size:16px}
.pair[aria-pressed=true]{border-color:var(--terra);background:var(--card);box-shadow:0 0 0 1px var(--terra) inset}
.pair .av{display:flex}
.pair .av img,.av2 img{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:center top;border:2px solid var(--gold);background:var(--card2)}
.pair .av img+img{margin-left:-10px}
.pair .tn{font-family:var(--display);font-size:10px;letter-spacing:.1em;color:var(--soft)}

/* escena */
.scene-wrap{position:relative;margin-top:14px;border-radius:10px;overflow:hidden;border:2px solid var(--walnut);background:#0d1530;--u:2.7;box-shadow:0 0 0 1px var(--gold)}
#scene{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges}
.sign{position:absolute;left:53.125%;top:10%;width:35.625%;height:20%;display:flex;align-items:center;justify-content:center;overflow:hidden;pointer-events:none}
.sign img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.sign span{font-family:var(--pix);font-weight:700;color:#ffe9b0;text-align:center;font-size:max(9px,calc(var(--u)*5px));line-height:1;text-shadow:calc(var(--u)*.5px) calc(var(--u)*.5px) 0 #2a1c12}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fffdf3;color:#2a2018;font-family:var(--pix);font-weight:500;font-size:max(10px,calc(var(--u)*5px));line-height:1.12;padding:calc(var(--u)*1.4px) calc(var(--u)*2px);width:max-content;max-width:min(62%,calc(var(--u)*62px));text-align:center;
  border:max(2px,calc(var(--u)*.7px)) solid #2e2118;border-radius:calc(var(--u)*1.2px);pointer-events:none;animation:bub 3.6s ease-out forwards;z-index:3}
.bub:after{content:"";position:absolute;left:50%;bottom:calc(var(--u)*-2.1px);width:calc(var(--u)*2px);height:calc(var(--u)*2px);background:inherit;border:inherit;border-top:0;border-left:0;transform:translateX(-50%) rotate(45deg)}
.bub.pos{border-color:#2f7a3e;background:#f3ffe9;color:#1d4a26}
.bub.neg{border-color:#a33a2f;background:#fff0ec;color:#6a1f18}
@keyframes bub{0%{opacity:0;transform:translate(-50%,-80%) scale(.6)}10%{opacity:1;transform:translate(-50%,-100%) scale(1.08)}16%{transform:translate(-50%,-100%) scale(1)}84%{opacity:1}100%{opacity:0;transform:translate(-50%,-112%) scale(1)}}
.plus{position:absolute;transform:translateX(-50%);font-family:var(--pix);font-weight:700;font-size:max(18px,calc(var(--u)*8px));pointer-events:none;animation:plus 2.4s ease-out forwards;z-index:4;text-shadow:calc(var(--u)*.6px) calc(var(--u)*.6px) 0 #1a1208}
.plus.pos{color:#8fe08c}.plus.neg{color:#ff8f7e}
@keyframes plus{0%{opacity:0;margin-top:0}12%{opacity:1}100%{opacity:0;margin-top:calc(var(--u)*-14px)}}
.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(8,12,30,.45);z-index:5}
.start .btn{font-size:13px;padding:12px 22px;background:var(--terra);border-color:#E3C98E;color:#FBF7EF}
.cap{font-family:var(--pix);font-size:max(12px,calc(var(--u)*3.6px));position:relative;padding:8px 12px;background:#0a0e20;color:#f1e6cf;z-index:2;min-height:2.6em;line-height:1.25}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.ctl .grow{flex:1}
.kpis{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-top:14px}
.kpis .k b{display:block;font-family:var(--display);font-size:30px;line-height:1;color:var(--terra-ink)}
.kpis .k span{font-size:14px;color:var(--soft)}
.kpis .stars span{font-size:22px;color:var(--line);color:color-mix(in srgb,var(--soft) 35%,transparent)}
.kpis .stars span.on{color:var(--gold);text-shadow:0 0 1px var(--terra-ink)}
.stars{letter-spacing:.06em}
.final{margin-top:12px;padding:12px 14px;border-radius:9px;border:1px solid var(--gold);background:var(--card2)}
.final b{font-family:var(--display);color:var(--terra-ink)}
.tl{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.ev{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:9px;background:var(--card2);cursor:pointer;text-align:left;width:100%;font:inherit}
.ev.ok{border-left-color:var(--ok)} .ev.ko{border-left-color:var(--bad)} .ev.pend{opacity:.6;cursor:default}
.ev.on{background:var(--card);box-shadow:0 0 0 2px var(--terra) inset}
.ev .ic{font-family:var(--pix);font-size:20px;line-height:1.2;text-align:center}
.ev.ok .ic{color:var(--ok)} .ev.ko .ic{color:var(--bad)}
.ev b{font-family:var(--display);font-size:13px;letter-spacing:.05em}
.menu{white-space:pre-wrap;margin-top:8px}
.pie{margin-top:22px;text-align:center}
@media (max-width:600px){.pairs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}.pair{flex:0 0 auto;scroll-snap-align:start}}
@media (max-width:520px){.kpis .k b{font-size:26px}}
</style>
</head>

  if(!r.pend){ e.total=r.total; e.pasa=!!r.pasa; e.ge=r.ge; e.gf=r.gf; e.cli=r.cli; e.cat=r.pasa?(r.ge>0?'g+':'+'):(r.gf>0?'g-':'-'); } EV.push(e); if(!r.pend){ e.pi=PL.length; PL.push(e); } }); }); }
function tr(n){ return (DATA.trucks||[]).find(t=>t.n===n)||null; }
function chips(){ return DATA.pares.map((p,i)=>`<button class="pair" data-sel="${i}" aria-pressed="${i===SEL}"><span class="av">${[p.a,p.b].filter(Boolean).map(m=>`<img alt="" src="${esc(foto(m.id,m))}">`).join('')}</span><span>${[p.a,p.b].filter(Boolean).map(m=>esc(m.n)).join(' y ')}</span>${DATA.res&&p.cli!=null?`<span class="tn">${p.cli} cl.</span>`:''}</button>`).join(''); }
function listado(){ return EV.map(e=>{ const cls=e.pend?'pend':(e.pasa?'ok':'ko'); const ic=e.pend?'…':(e.pasa?'✔':'✖');
  return `<li><button class="ev ${cls}" ${e.pend?'disabled aria-disabled="true"':`data-pl="${e.pi}"`} style="width:100%"><span class="ic" aria-hidden="true">${ic}</span><span><b>${esc(e.n)}</b><div class="mini">${esc(e.who)} · ${esc(e.at)} + ${esc(e.hab)}${e.juez?' · '+esc(e.juez):''}</div>
   ${e.pend?'<div class="mini">'+(DATA.res?'Todavía falta esta tirada.':'Se verá cuando se publiquen los resultados.')+'</div>':`<div>${esc(txtGrado(e))} · total ${e.total} contra ${e.dif} <span class="chip ${e.cli>=0?'pos':'neg'}">${e.cli>0?'+':''}${e.cli} clientes</span></div>`}</span></button></li>`; }).join(''); }
function pintar(){ const p=PAR; const t=tr(p.truck); const U=(DATA.unidad||'Food truck');
  truckN=t?t.n:0; construirEventos();
  const nom=[p.a,p.b].filter(Boolean).map(m=>m.n).join(' y ');
  const hayRes=DATA.res&&PL.length>0;
  $('#app').innerHTML=`
   <div class="panel"><div class="eyebrow">${esc(DATA.titulo||'Ronda 2')}</div>
    <h2>${t?esc(t.nombre):'Todavía sin '+esc(U.toLowerCase())}</h2>
    <p class="sub">${t?esc(t.comida||''):''}${t&&t.comida?' · ':''}Pareja: ${esc(nom)}${DATA.res&&p.gana?' · <b>🥄 Cuchara de Oro</b>':''}</p>
    <div class="pairs" role="group" aria-label="Elegir pareja">${chips()}</div>
    <div class="scene-wrap" id="sw"><canvas id="scene" width="${W}" height="${H}" role="img" aria-label="Escena en pixel del food truck con su fila de clientes"></canvas>
      <div class="sign">${t&&t.img?`<img alt="Cartel de ${esc(t.nombre)}" src="${esc(t.img)}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${esc((t&&t.nombre)||'').replace(/'/g,'’')}'}))">`:`<span>${t?esc(t.nombre):'¿?'}</span>`}</div>
      <div class="cap" id="cap" aria-live="polite">${hayRes?'Pulsa Reproducir para ver la jornada.':(t?(DATA.res?'Todavía no hay tiradas resueltas.':'Los clientes esperan: los resultados se publican al cerrar el turno.'):'Este truck todavía no salió.')}</div>
      ${hayRes?`<div class="start" id="start"><button class="btn" id="bstart">▶ Ver la jornada</button><button class="btn" id="bskip" style="background:var(--card);color:var(--ink)">Ir al resultado</button></div>`:''}</div>
    <div class="ctl"><button class="btn" id="bprev" aria-label="Tirada anterior">◀</button><button class="btn primary" id="bplay" ${hayRes?'':'disabled'}>▶ Reproducir</button><button class="btn" id="bnext" aria-label="Tirada siguiente">▶|</button><button class="btn" id="bres" ${hayRes?'':'disabled'}>Reiniciar</button>
      <span class="grow"></span><label class="mini">Velocidad <select id="vel" style="font-size:15px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--card2)"><option value="0.6">Lenta</option><option value="1" selected>Normal</option><option value="1.8">Rápida</option></select></label></div>
    <div class="kpis"><div class="k"><b class="num" id="kc">0</b><span>clientes satisfechos</span></div><div class="k"><div class="stars" id="kst" aria-label="Estrellas"></div><span><b class="num" id="kn" style="display:inline;font-size:16px">0</b> de 12 estrellas</span></div></div>
    <div class="final" id="fin" hidden><b>Jornada terminada</b><div id="finT"></div></div></div>
   <div class="panel"><div class="eyebrow">Tirada por tirada</div><h2>La jornada</h2>
    <p class="sub">Cada tirada superada trae clientes, cada una fallada los espanta. Toca una para verla en la escena.</p>
    <ul class="tl">${listado()||'<li class="mini">Todavía no hay tiradas para esta pareja.</li>'}</ul></div>
   ${t&&t.menu?`<div class="panel"><div class="eyebrow">Carta del día</div><h2>${esc(t.nombre)}</h2><div class="menu">${esc(t.menu)}</div></div>`:''}`;
  hud(0); botones(); escala();
  const fin=$('#finT'); if(fin&&hayRes){ fin.innerHTML=`${p.cli} clientes satisfechos = <b>${p.st} ★</b>${p.gana?' · 🥄 Cuchara de Oro para los dos':''}.`; }
  const cv=$('#scene'); ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
  Q.length=0; FX.length=0; setQueue(hayRes?0:(t?2:0),true); Q.forEach(q=>{ q.mood=''; });
  if(!hayRes&&t&&!DATA.res) { /* curiosos mirando la carta */ }
  initNieve(); dibujar(); arrancarBucle(); }
let ctx=null;

document.addEventListener('click',ev=>{ const b=ev.target.closest('button'); if(!b) return;
  if(b.dataset.sel!==undefined){ detener(); SEL=+b.dataset.sel; PAR=DATA.pares[SEL]; try{ sessionStorage.setItem('mc-truck-sel',SEL); }catch(e){} pintar(); return; }
  if(b.id==='bstart'){ $('#start').remove(); reproducir(); return; }
  if(b.id==='bskip'){ $('#start').remove(); irFinal(); return; }
  if(b.id==='bplay'){ $('#start')?.remove(); reproducir(); return; }
  if(b.id==='bnext'){ $('#start')?.remove(); siguiente(); return; }
  if(b.id==='bprev'){ anterior(); return; }
  if(b.id==='bres'){ $('#start')?.remove(); reiniciar(); return; }
  if(b.dataset.pl!==undefined){ $('#start')?.remove(); irA(+b.dataset.pl); document.getElementById('sw')?.scrollIntoView({block:'center',behavior:RM?'auto':'smooth'}); return; } });
document.addEventListener('change',ev=>{ if(ev.target.id==='vel') vel=+ev.target.value||1; });
window.addEventListener('resize',escala);

function espera(msg,sub){ $('#app').innerHTML=`<div class="panel espera"><div class="mini-truck" aria-hidden="true"><div class="a"></div><div class="b"></div><div class="v"></div><div class="c"></div><div class="w"></div><div class="r1"></div><div class="r2"></div></div><h2>${esc(msg)}</h2><p>${esc(sub)}</p></div>`; }
async function iniciar(){
  try{ const d=await cargar(); const T=d&&d.truck;
    if(!T||!T.vis||!Array.isArray(T.pares)){ DATA=null; detener(); espera('El food truck todavía no salió','Hana lo publicará cuando empiece la Ronda 2. Vuelve más tarde.'); return; }
    const nuevo=!DATA; const firma=JSON.stringify(T); if(DATA&&JSON.stringify(DATA)===firma) return; DATA=T;
    if(nuevo){ YO=leerYo(); let s=-1; try{ s=+sessionStorage.getItem('mc-truck-sel'); }catch(e){} if(!(s>=0&&s<DATA.pares.length)) s=DATA.pares.findIndex(p=>(p.a&&p.a.id===YO)||(p.b&&p.b.id===YO)); SEL=s>=0?s:0; PAR=DATA.pares[SEL]; pintar(); }
    else if(!playing){ const i=IDX; PAR=DATA.pares[Math.min(SEL,DATA.pares.length-1)]; pintar(); if(i>=0&&i<PL.length) { $('#start')?.remove(); paso(i,false); } }
    $('#pie').textContent='Se actualiza sola cuando Hana publica novedades.';
  }catch(e){ if(!DATA) espera('No pude abrir el food truck','Revisa tu conexión e inténtalo de nuevo en un rato.'); } }
iniciar(); setInterval(()=>{ if(!document.hidden&&!playing) iniciar(); },60000);
</script>
